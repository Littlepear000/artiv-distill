# artiv.unicell.org.cn — ArtivDistill (docker compose, web container @ 127.0.0.1:8012)
# Installed by root into /etc/infra/nginx/conf.d/sites-enabled/ on the shared server.
# Paths below are container-side paths of the shared-nginx container.

server {
    listen 80;
    listen [::]:80;
    server_name artiv.unicell.org.cn;

    location /.well-known/acme-challenge/ { root /var/www/certbot; }
    location / { return 301 https://artiv.unicell.org.cn$request_uri; }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name artiv.unicell.org.cn;

    ssl_certificate     /etc/nginx/ssl/artiv.unicell.org.cn/fullchain.pem;
    ssl_certificate_key /etc/nginx/ssl/artiv.unicell.org.cn/privkey.pem;
    include conf.d/snippets/ssl-params.conf;
    include conf.d/snippets/security-headers.conf;

    client_max_body_size 200m;

    access_log /var/log/nginx/artiv-distill.access.log;
    error_log  /var/log/nginx/artiv-distill.error.log;

    # Sandbox-only LLM relay: never reachable from the public side.
    location ^~ /api/internal/ { return 404; }

    location / {
        proxy_pass http://artiv-distill;
        include conf.d/snippets/proxy-params.conf;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }
}
